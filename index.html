    <div class="pagos-header">
      <h1>Pagos</h1>
      <small>Registro de los pagos que han realizado los clientes</small>
    </div>

    <div class="tarjetas-resumen">
      <div class="tarjetas">
        <h2>Total</h2>
        <span id="tarjeta-total">$0</span>
      </div>
      <div class="tarjetas">
        <h2>Registros</h2>
        <span id="tarjeta-registros">0</span>
      </div>
      <div class="tarjetas"></div>
      <div class="tarjetas"></div>
    </div>

    <div class="datosContainer">
      <div class="datosContainerHeader">
        <button class="btn-agregar btn-general" id="abrir">Nuevo pago</button>
      </div>

      <table id="table-pagos" data-lista="listaPagos">
        <colgroup>
          <col />
          <col />
          <col />
          <col />
          <col />
        </colgroup>

        <thead>
          <tr>
            <th data-name-col="date-pago">Fecha</th>
            <th data-name-col="client-name">Cliente</th>
            <th data-name-col="concept">Concepto</th>
            <th data-name-col="amount">Cantidad</th>
            <th data-name-col="acciones">Acciones</th>
          </tr>
        </thead>

        <tbody></tbody>

        <!-- <tfoot>
            <tr>
              <td colspan="3">Total</td>
              <td data-name-col="totalCantidad"></td>
              <td></td>
            </tr>
          </tfoot> -->
      </table>
    </div>

    <dialog id="miDialogo">
      <div class="dialogoContainer">
        <form action="" id="formDatos" data-table="table-pagos">

          <div class="form-section">
            <div>
              <h2>Cliente</h2>
              <input type="text" name="client-name" id="client-name" required />
              <!-- <label for="radio">Clic aquí</label> -->
            </div>

            <div>
              <h2>Fecha</h2>
              <input type="date" name="date-pago" id="date-pago" />
              <!-- <label for="radio">Clic aquí</label> -->
            </div>
          </div>


          <div class="form-section">
            <div>
              <h2>Concepto</h2>
              <input type="text" name="concept" id="concept" required />
              <!-- <label for="radio">Clic aquí</label> -->
            </div>

            <div>
              <h2>Cantidad</h2>
              <input type="number" step="0.01" name="amount" id="amount" required />
              <!-- <label for="radio">Clic aquí</label> -->
            </div>
          </div>

          <div class="button-form-section">
            <button class="btn-general" type="submit" id="boton-guardar"> Guardar</button>

            <button class="btn-general" id="cerrar" data-accion="cerrar">Cerrar</button>
          </div>
        </form>






      </div>
    </dialog>
